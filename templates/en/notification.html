<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alert - {{device_name}}</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; margin: 0; padding: 20px;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <tr>
      <td style="background-color: #ff4649; color: #ffffff; padding: 20px; text-align: center;">
        <h2 style="margin: 0;">🚨 Alert Detected</h2>
      </td>
    </tr>

    <tr>
      <td style="padding: 20px; color: #333333;">
        <p>
          An alert has been triggered on the device <strong>{{device_name}}</strong>.
        </p>
        <p>
          <strong>Type:</strong> {{event_type}}<br>
          <strong>Severity:</strong> <span style="color: {{ 'red' if severity == 'High' else 'orange' if severity == 'Medium' else 'green' }};">{{severity}}</span><br>
          <strong>Date:</strong> {{alert_date}}
        </p>
        <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 20px 0;">
        <p style="font-size: 14px; color: #777777;">
          This is an automated notification generated by your device monitoring system. Please visit the platform for more details.
        </p>
      </td>
    </tr>
  </table>

</body>
</html>
